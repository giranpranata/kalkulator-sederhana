
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Sederhana</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101827;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 340px;
      padding: 20px;
      border-radius: 16px;
      background: #1c2639;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .3);
    }

    h2 {
      margin: 5px 0 20px;
      color: white;
      font-size: 20px;
      text-align: center;
    }

    .screen {
      height: 100px;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #0c1424;
      text-align: right;
      overflow: hidden;
    }

    #expression {
      height: 25px;
      color: #a8b4c8;
      font-size: 17px;
      overflow: hidden;
      white-space: nowrap;
    }

    #display {
      color: white;
      font-size: 34px;
      font-weight: bold;
      overflow: hidden;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 10px;
      background: #303c52;
      color: white;
      font-size: 21px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.2);
    }

    button:active {
      transform: scale(.96);
    }

    .operator {
      background: #345587;
    }

    .clear {
      background: #b64257;
    }

    .equal {
      background: #087df5;
    }

    footer {
      margin-top: 22px;
      color: #aab6c9;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <h2>Kalkulator Sederhana</h2>

    <div class="screen">
      <div id="expression"></div>
      <div id="display">0</div>
    </div>

    <div class="buttons">
      <button class="clear" onclick="clearAll()">C</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="setOperator('/')">÷</button>
      <button class="operator" onclick="setOperator('*')">×</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="setOperator('-')">−</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="setOperator('+')">+</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="equal" onclick="calculate()">=</button>

      <button onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button onclick="changeSign()">+/−</button>
      <button onclick="percentage()">%</button>
    </div>

    <footer>Dibuat Oleh Giran Pranata Umbola</footer>
  </div>

  <script>
    const display = document.getElementById("display");
    const expression = document.getElementById("expression");

    let firstNumber = null;
    let operator = null;
    let newNumber = false;

    const symbols = {
      "+": "+",
      "-": "−",
      "*": "×",
      "/": "÷"
    };

    function appendNumber(value) {
      if (display.textContent === "Error") {
        clearAll();
      }

      if (newNumber) {
        display.textContent = "0";
        newNumber = false;
      }

      if (value === "." && display.textContent.includes(".")) {
        return;
      }

      if (display.textContent === "0" && value !== ".") {
        display.textContent = value;
      } else {
        display.textContent += value;
      }

      updateExpression();
    }

    function updateExpression() {
      if (operator !== null) {
        expression.textContent =
          firstNumber + " " + symbols[operator] + " " +
          (newNumber ? "" : display.textContent);
      }
    }

    function setOperator(op) {
      if (display.textContent === "Error") return;

      firstNumber = Number(display.textContent);
      operator = op;
      newNumber = true;

      expression.textContent =
        firstNumber + " " + symbols[operator];
    }

    function calculate() {
      if (operator === null || firstNumber === null) return;

      const secondNumber = Number(display.textContent);
      const calculation =
        firstNumber + " " + symbols[operator] +
        " " + secondNumber + " =";

      let result;

      switch (operator) {
        case "+":
          result = firstNumber + secondNumber;
          break;
        case "-":
          result = firstNumber - secondNumber;
          break;
        case "*":
          result = firstNumber * secondNumber;
          break;
        case "/":
          result = secondNumber === 0
            ? NaN
            : firstNumber / secondNumber;
          break;
      }

      expression.textContent = calculation;
      display.textContent = Number.isFinite(result)
        ? String(Number(result.toPrecision(12)))
        : "Error";

      firstNumber = null;
      operator = null;
      newNumber = true;
    }

    function clearAll() {
      display.textContent = "0";
      expression.textContent = "";
      firstNumber = null;
      operator = null;
      newNumber = false;
    }

    function deleteLast() {
      if (display.textContent === "Error") {
        clearAll();
        return;
      }

      if (newNumber) {
        display.textContent = "0";
        newNumber = false;
      } else {
        display.textContent =
          display.textContent.slice(0, -1) || "0";
      }

      updateExpression();
    }

    function changeSign() {
      if (display.textContent === "Error") return;

      display.textContent =
        String(-Number(display.textContent));

      newNumber = false;
      updateExpression();
    }

    function percentage() {
      if (display.textContent === "Error") return;

      display.textContent =
        String(Number(display.textContent) / 100);

      newNumber = false;
      updateExpression();
    }
  </script>

</body>
</html>
