
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Sederhana</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101827;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 330px;
      padding: 20px;
      background: #1c2639;
      border-radius: 18px;
      box-shadow: 0 15px 40px #0005;
    }

    h2 {
      color: white;
      text-align: center;
      font-size: 19px;
    }

    #display {
      width: 100%;
      height: 75px;
      padding: 15px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      background: #0c1424;
      color: white;
      font-size: 30px;
      text-align: right;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 10px;
      background: #303c52;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.25);
    }

    .operator {
      background: #345587;
    }

    .clear {
      background: #b64257;
    }

    .equal {
      background: #087df5;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      color: #aab6c9;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <h2>Kalkulator Sederhana</h2>

    <input type="text" id="display"
           value="0" readonly>

    <div class="buttons">
      <button class="clear" onclick="clearAll()">C</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="setOperator('/')">÷</button>
      <button class="operator" onclick="setOperator('*')">×</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="setOperator('-')">−</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="setOperator('+')">+</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="equal" onclick="calculate()">=</button>

      <button onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button onclick="changeSign()">+/−</button>
      <button onclick="percentage()">%</button>
    </div>

    <footer>Dibuat untuk Tugas Pemrograman Web</footer>
  </div>

  <script>
    const display = document.getElementById("display");

    let firstNumber = null;
    let operator = null;
    let newNumber = false;

    function appendNumber(value) {
      if (display.value === "Error") {
        display.value = "0";
      }

      if (newNumber) {
        display.value = "0";
        newNumber = false;
      }

      if (value === "." && display.value.includes(".")) {
        return;
      }

      if (display.value === "0" && value !== ".") {
        display.value = value;
      } else {
        display.value += value;
      }
    }

    function clearAll() {
      display.value = "0";
      firstNumber = null;
      operator = null;
      newNumber = false;
    }

    function deleteLast() {
      if (display.value === "Error" || newNumber) {
        display.value = "0";
        newNumber = false;
        return;
      }

      display.value = display.value.slice(0, -1) || "0";
    }

    function setOperator(op) {
      if (display.value === "Error") return;

      firstNumber = Number(display.value);
      operator = op;
      newNumber = true;
    }

    function calculate() {
      if (operator === null || firstNumber === null) return;

      const secondNumber = Number(display.value);
      let result;

      switch (operator) {
        case "+":
          result = firstNumber + secondNumber;
          break;
        case "-":
          result = firstNumber - secondNumber;
          break;
        case "*":
          result = firstNumber * secondNumber;
          break;
        case "/":
          result = secondNumber === 0
            ? NaN
            : firstNumber / secondNumber;
          break;
      }

      display.value = Number.isFinite(result)
        ? String(Number(result.toPrecision(12)))
        : "Error";

      firstNumber = null;
      operator = null;
      newNumber = true;
    }

    function changeSign() {
      if (display.value !== "Error") {
        display.value = String(-Number(display.value));
      }
    }

    function percentage() {
      if (display.value !== "Error") {
        display.value = String(Number(display.value) / 100);
      }
    }
  </script>
</body>
</html>
